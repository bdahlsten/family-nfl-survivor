<script type="module">
import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const supabase=createClient('https://nvtsrpfzedzzoeyvobcb.supabase.co','sb_publishable_7xYfbXDNCZSUqFTipF9A-Q_MHeVqTnz');
let currentUser=null,currentProfile=null,currentSeason=null,currentWeek=null,maxStrikes=3,profiles=[],teamMap=new Map(),currentGames=[],seasonGames=[],currentPick=null,seasonPicks=[],visiblePicks=[],visibleSeasonPicks=[],lossPicks=[],strikeAdjustments=[],pickStatusMap=new Map(),usedTeamIds=new Set(),recoveryMode=false;const $=id=>document.getElementById(id);
function showAppSection(target){document.querySelectorAll('.app-section').forEach(section=>section.classList.toggle('active',section.dataset.section===target));document.querySelectorAll('.nav-button').forEach(button=>button.classList.toggle('active',button.dataset.target===target));window.scrollTo({top:0,behavior:'smooth'})}document.querySelectorAll('.nav-button').forEach(button=>button.addEventListener('click',()=>showAppSection(button.dataset.target)));
function showLoginScreen(){$('login').style.display='block';$('resetPasswordScreen').style.display='none';$('app').style.display='none'}function showResetScreen(){recoveryMode=true;$('login').style.display='none';$('app').style.display='none';$('resetPasswordScreen').style.display='block'}
async function showLoggedInUser(user){currentUser=user;const{data,error}=await supabase.from('profiles').select('display_name, is_commissioner').eq('id',user.id).single();if(error){showLoginScreen();$('message').textContent=error.message;return}currentProfile=data;$('login').style.display='none';$('resetPasswordScreen').style.display='none';$('app').style.display='block';$('welcome').textContent='Welcome, '+data.display_name;$('commissionerPanel').style.display=data.is_commissioner?'block':'none';showAppSection('home');await loadCurrentWeek()}
async function loadCurrentWeek(){$('loading').style.display='block';$('loading').textContent='Loading games...';const{data:settings,error:settingsError}=await supabase.from('pool_settings').select('pool_name, current_season, current_week, max_strikes').eq('id',1).single();if(settingsError){$('loading').textContent='Error loading pool settings: '+settingsError.message;return}currentSeason=settings.current_season;currentWeek=settings.current_week;maxStrikes=settings.max_strikes;$('poolName').textContent=settings.pool_name;$('weekInfo').textContent=currentSeason+' Season - Week '+currentWeek;$('weekPicksHeading').textContent='Week '+currentWeek+' Picks';$('myPicksDescription').textContent=currentSeason+' season pick history.';$('adminSeason').value=currentSeason;$('adminWeek').value=currentWeek;await loadTeams();await loadProfiles();await loadPickStatuses();await loadSeasonGames();await loadGames();await loadMySeasonPicks();await loadMyPick();await loadVisiblePicks();await loadVisibleSeasonPicks();await loadLossPicks();await loadStrikeAdjustments();populateHistorySelectors();renderMyPick();renderStandings();renderFamilyPicks();renderMyPickHistory();renderPlayerHistory();renderWeekHistory();renderGames()}
async function loadTeams(){const{data,error}=await supabase.from('teams').select('id, abbreviation, full_name');if(error)throw new Error('Error loading teams: '+error.message);teamMap=new Map();data.forEach(team=>teamMap.set(team.id,team))}async function loadProfiles(){const{data,error}=await supabase.from('profiles').select('id, display_name').order('display_name');if(error)throw new Error('Error loading players: '+error.message);profiles=data||[]}
async function loadPickStatuses(){const{data,error}=await supabase.rpc('get_current_week_pick_status');if(error){console.error('Error loading pick submission status:',error);pickStatusMap=new Map();return}pickStatusMap=new Map((data||[]).map(row=>[row.player_id,row.has_pick===true]))}async function loadSeasonGames(){const{data,error}=await supabase.from('games').select('id, week, kickoff_at').eq('season',currentSeason);if(error)throw new Error('Error loading season games: '+error.message);seasonGames=data||[]}async function loadGames(){const{data,error}=await supabase.from('games').select('id, away_team_id, home_team_id, kickoff_at, status, away_score, home_score').eq('season',currentSeason).eq('week',currentWeek).order('kickoff_at');if(error){$('loading').textContent='Error loading games: '+error.message;return}currentGames=data||[];$('loading').style.display='none'}
async function loadMySeasonPicks(){const{data,error}=await supabase.from('picks').select('id, week, team_id, game_id, result').eq('player_id',currentUser.id).eq('season',currentSeason).order('week');if(error){$('pickMessage').textContent='Error loading your picks: '+error.message;return}seasonPicks=data||[];usedTeamIds=new Set(seasonPicks.filter(p=>p.week!==currentWeek).map(p=>p.team_id))}async function loadMyPick(){const{data,error}=await supabase.from('picks').select('*').eq('player_id',currentUser.id).eq('season',currentSeason).eq('week',currentWeek).maybeSingle();if(error){$('pickMessage').textContent='Error loading your current pick: '+error.message;return}currentPick=data}async function loadVisiblePicks(){const{data,error}=await supabase.from('picks').select('player_id, team_id, game_id, result').eq('season',currentSeason).eq('week',currentWeek);if(error){$('familyPicks').textContent='Error loading picks: '+error.message;return}visiblePicks=data||[]}async function loadVisibleSeasonPicks(){const{data,error}=await supabase.from('picks').select('player_id, week, team_id, game_id, result').eq('season',currentSeason);if(error)throw new Error('Error loading pick history: '+error.message);visibleSeasonPicks=data||[]}async function loadLossPicks(){const{data,error}=await supabase.from('picks').select('player_id').eq('season',currentSeason).eq('result','loss');if(error){$('standings').textContent='Error loading strike count: '+error.message;return}lossPicks=data||[]}
async function loadStrikeAdjustments(){const{data,error}=await supabase.from('strike_adjustments').select('player_id, strikes, week, reason').eq('season',currentSeason);if(error){$('standings').textContent='Error loading strike adjustments: '+error.message;strikeAdjustments=[];return}strikeAdjustments=data||[]}
function populateHistorySelectors(){$('playerHistorySelect').innerHTML=profiles.map(p=>`<option value="${p.id}">${p.display_name}</option>`).join('');$('playerHistorySelect').value=currentUser.id;let weekOptions='';for(let week=1;week<=currentWeek;week++)weekOptions+=`<option value="${week}">Week ${week}</option>`;$('weekHistorySelect').innerHTML=weekOptions;$('weekHistorySelect').value=currentWeek}function weekIsFullyStarted(week){const games=seasonGames.filter(game=>game.week===week);if(games.length===0)return false;return games.every(game=>new Date(game.kickoff_at)<=new Date())}function resultInfo(result){if(result==='win')return['WIN','win'];if(result==='loss')return['LOSS','loss'];if(result==='tie')return['TIE','tie'];if(result==='void')return['VOID','void'];return['PENDING','pending']}
function renderMyPickHistory(){const pickMap=new Map(seasonPicks.map(p=>[p.week,p]));let html='';for(let week=currentWeek;week>=1;week--){const pick=pickMap.get(week);if(!pick){html+=`<div class="history-row"><div class="history-week">Week ${week}</div><div class="history-team none">No Pick</div><div class="result-badge none">NO PICK</div></div>`;continue}const team=teamMap.get(pick.team_id);const[label,className]=resultInfo(pick.result);html+=`<div class="history-row"><div class="history-week">Week ${week}</div><div class="history-team ${className}">${team?.full_name||'Unknown Team'}</div><div class="result-badge ${className}">${label}</div></div>`}$('myPickHistory').innerHTML=html}
function renderPlayerHistory(){const playerId=$('playerHistorySelect').value;const player=profiles.find(p=>p.id===playerId);if(!player)return;let html='';for(let week=currentWeek;week>=1;week--){const pick=visibleSeasonPicks.find(p=>p.player_id===playerId&&p.week===week);if(!pick){const fullyStarted=weekIsFullyStarted(week),label=fullyStarted?'No Pick':'Hidden / Not Revealed';html+=`<div class="history-row"><div class="history-week">Week ${week}</div><div class="history-team ${fullyStarted?'none':'hidden'}">${label}</div><div class="result-badge ${fullyStarted?'none':'hidden'}">${fullyStarted?'NO PICK':'HIDDEN'}</div></div>`;continue}const team=teamMap.get(pick.team_id);const[label,className]=resultInfo(pick.result);html+=`<div class="history-row"><div class="history-week">Week ${week}</div><div class="history-team ${className}">${team?.full_name||'Unknown Team'}</div><div class="result-badge ${className}">${label}</div></div>`}$('playerHistory').innerHTML=html}
function renderWeekHistory(){const week=Number($('weekHistorySelect').value),fullyStarted=weekIsFullyStarted(week);$('weekHistory').innerHTML=profiles.map(player=>{const pick=visibleSeasonPicks.find(p=>p.player_id===player.id&&p.week===week);if(pick){const team=teamMap.get(pick.team_id);const[label,className]=resultInfo(pick.result);return`<div class="week-history-row"><div class="week-player-name">${player.display_name}</div><div class="week-player-pick ${className}">${team?.full_name||'Unknown Team'}</div><div class="result-badge ${className}">${label}</div></div>`}const text=fullyStarted?'No Pick':'Hidden / Not Revealed',badgeText=fullyStarted?'NO PICK':'HIDDEN',className=fullyStarted?'none':'hidden';return`<div class="week-history-row"><div class="week-player-name">${player.display_name}</div><div class="week-player-pick hidden-pick">${text}</div><div class="result-badge ${className}">${badgeText}</div></div>`}).join('')}
function renderStandings(){$('standings').innerHTML=profiles.map(player=>{const lossStrikes=lossPicks.filter(p=>p.player_id===player.id).length;const adjustmentStrikes=strikeAdjustments.filter(a=>a.player_id===player.id).reduce((total,a)=>total+Number(a.strikes||0),0);const strikes=lossStrikes+adjustmentStrikes;const eliminated=strikes>=maxStrikes;return`<div class="standing-row"><div class="standing-name">${player.display_name}</div><div class="standing-info"><div class="strike-count">${strikes} ${strikes===1?'strike':'strikes'}</div><div class="${eliminated?'eliminated':'alive'}">${eliminated?'Eliminated':'Still Alive'}</div></div></div>`}).join('')}function renderFamilyPicks(){$('familyPicks').innerHTML=profiles.map(player=>{const pick=visiblePicks.find(p=>p.player_id===player.id);if(!pick){const hasPick=pickStatusMap.get(player.id)===true;return`<div class="family-row"><div class="player-name">${player.display_name}${player.id===currentUser.id?'<span class="my-pick-label">YOU</span>':''}</div><div class="player-pick">${hasPick?'<div class="pick-submitted">Pick Submitted</div><div class="pick-status-note">Hidden Until Kickoff</div>':'<div class="no-pick-yet">No Pick Yet</div>'}</div></div>`}const team=teamMap.get(pick.team_id),game=currentGames.find(g=>g.id===pick.game_id);if(!team){return`<div class="family-row"><div class="player-name">${player.display_name}${player.id===currentUser.id?'<span class="my-pick-label">YOU</span>':''}</div><div class="player-pick">Unknown Team</div></div>`}const[,resultClass]=resultInfo(pick.result);let detail='';if(game){if(game.status==='final'){const away=teamMap.get(game.away_team_id),home=teamMap.get(game.home_team_id);if(game.away_score!==null&&game.away_score!==undefined&&game.home_score!==null&&game.home_score!==undefined&&away&&home){const pickedIsAway=pick.team_id===game.away_team_id;const opponent=pickedIsAway?home:away;const pickedScore=pickedIsAway?game.away_score:game.home_score;const opponentScore=pickedIsAway?game.home_score:game.away_score;detail=`${team.abbreviation} ${pickedScore} - ${opponent.abbreviation} ${opponentScore} · FINAL`}else{detail='FINAL'}}else if(game.status==='in_progress'){detail='IN PROGRESS'}else if(game.status==='postponed'){detail='POSTPONED'}else if(game.status==='cancelled'){detail='CANCELLED'}else{detail='NOT STARTED'}}return`<div class="family-row"><div class="player-name">${player.display_name}${player.id===currentUser.id?'<span class="my-pick-label">YOU</span>':''}</div><div class="player-pick"><div class="home-pick-team ${resultClass}">${team.full_name}</div>${detail?`<div class="pick-score ${resultClass}">${detail}</div>`:''}</div></div>`}).join('')}function renderMyPick(){if(!currentPick){$('pickStatusTeam').textContent='No pick submitted';$('pickStatusNote').textContent='Select a team from the Pick tab.';return}const team=teamMap.get(currentPick.team_id);$('pickStatusTeam').textContent=team?.full_name||'Unknown Team';const game=currentGames.find(g=>g.id===currentPick.game_id);$('pickStatusNote').textContent=game&&new Date(game.kickoff_at)<=new Date()?'Locked. This game has started.':'You may change this pick until kickoff.'}
function renderGames(){const now=new Date();$('games').innerHTML=currentGames.map(game=>{const away=teamMap.get(game.away_team_id),home=teamMap.get(game.home_team_id),started=new Date(game.kickoff_at)<=now;return`<div class="game-card"><div class="game-header"><div class="kickoff">${new Date(game.kickoff_at).toLocaleString([],{weekday:'short',month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})}</div><div class="status ${started?'locked':'available'}">${started?'Locked':'Available'}</div></div><div class="teams">${teamButton(game,away,started)}${teamButton(game,home,started)}</div></div>`}).join('');document.querySelectorAll('.team-button:not(:disabled)').forEach(button=>{button.onclick=()=>chooseTeam(Number(button.dataset.gameId),Number(button.dataset.teamId))})}function teamButton(game,team,started){const selected=currentPick?.team_id===team.id,used=usedTeamIds.has(team.id),disabled=started||used;return`<button class="team-button ${selected?'selected':''} ${used?'used':''}" data-game-id="${game.id}" data-team-id="${team.id}" ${disabled?'disabled':''}>${team.full_name}${used?'<span class="used-label">USED</span>':''}</button>`}
async function chooseTeam(gameId,teamId){const team=teamMap.get(teamId);if(!team)return;if(currentPick&&currentPick.team_id===teamId){$('pickMessage').textContent='That is already your current pick.';return}if(usedTeamIds.has(teamId)){$('pickMessage').textContent='You already used this team earlier in the season.';return}const confirmed=confirm(currentPick?`Change your pick to ${team.full_name}?`:`Submit ${team.full_name} as your Week ${currentWeek} pick?`);if(!confirmed)return;$('pickMessage').textContent='Saving pick...';let error;if(!currentPick){({error}=await supabase.from('picks').insert({player_id:currentUser.id,game_id:gameId,season:currentSeason,week:currentWeek,team_id:teamId}))}else{({error}=await supabase.from('picks').update({game_id:gameId,team_id:teamId}).eq('id',currentPick.id))}if(error){$('pickMessage').textContent='Could not save pick: '+error.message;return}$('pickMessage').textContent='Pick saved successfully.';await loadCurrentWeek()}
$('byPlayerButton').onclick=()=>{$('byPlayerButton').classList.add('active');$('byWeekButton').classList.remove('active');$('playerHistoryControls').classList.add('active');$('playerHistoryView').classList.add('active');$('weekHistoryControls').classList.remove('active');$('weekHistoryView').classList.remove('active')};$('byWeekButton').onclick=()=>{$('byWeekButton').classList.add('active');$('byPlayerButton').classList.remove('active');$('weekHistoryControls').classList.add('active');$('weekHistoryView').classList.add('active');$('playerHistoryControls').classList.remove('active');$('playerHistoryView').classList.remove('active')};$('playerHistorySelect').addEventListener('change',renderPlayerHistory);$('weekHistorySelect').addEventListener('change',renderWeekHistory);
$('loginButton').onclick=async()=>{$('message').textContent='Signing in...';const{data,error}=await supabase.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error){$('message').textContent=error.message;return}$('message').textContent='';await showLoggedInUser(data.user)};$('password').addEventListener('keydown',event=>{if(event.key==='Enter')$('loginButton').click()});
$('forgotPasswordButton').onclick=async()=>{const email=$('email').value.trim();if(!email){$('message').textContent='Enter your email address first.';return}$('message').textContent='Sending password reset email...';const{error}=await supabase.auth.resetPasswordForEmail(email,{redirectTo:window.location.origin+window.location.pathname});$('message').textContent=error?'Could not send reset email: '+error.message:'Password reset email sent. Check your inbox and spam folder.'};
$('setNewPasswordButton').onclick=async()=>{const password=$('resetNewPassword').value,confirmPassword=$('resetConfirmPassword').value;if(password.length<8){$('resetPasswordMessage').textContent='Password must be at least 8 characters.';return}if(password!==confirmPassword){$('resetPasswordMessage').textContent='Passwords do not match.';return}const{data,error}=await supabase.auth.updateUser({password});if(error){$('resetPasswordMessage').textContent='Could not update password: '+error.message;return}recoveryMode=false;window.history.replaceState({},document.title,window.location.pathname);if(data&&data.user)await showLoggedInUser(data.user);else{showLoginScreen();$('message').textContent='Password changed. Sign in with your new password.'}};
$('changePasswordButton').onclick=async()=>{const password=$('accountNewPassword').value,confirmPassword=$('accountConfirmPassword').value;if(password.length<8){$('changePasswordMessage').textContent='Password must be at least 8 characters.';return}if(password!==confirmPassword){$('changePasswordMessage').textContent='Passwords do not match.';return}const{error}=await supabase.auth.updateUser({password});if(error){$('changePasswordMessage').textContent='Could not change password: '+error.message;return}$('accountNewPassword').value='';$('accountConfirmPassword').value='';$('changePasswordMessage').textContent='Password changed successfully.'};
$('logoutButton').onclick=async()=>{await supabase.auth.signOut();showLoginScreen()};$('previousWeekButton').onclick=()=>{$('adminWeek').value=Math.max(1,Number($('adminWeek').value)-1)};$('nextWeekButton').onclick=()=>{$('adminWeek').value=Math.min(22,Number($('adminWeek').value)+1)};
$('saveWeekButton').onclick=async()=>{if(!currentProfile||!currentProfile.is_commissioner)return;const season=Number($('adminSeason').value),week=Number($('adminWeek').value);if(!Number.isInteger(season)||season<2020||season>2100){$('commissionerMessage').textContent='Enter a valid season.';return}if(!Number.isInteger(week)||week<1||week>22){$('commissionerMessage').textContent='Week must be between 1 and 22.';return}if(!confirm(`Change the active pool to ${season} Week ${week}?`))return;$('commissionerMessage').textContent='Saving week...';const{error}=await supabase.from('pool_settings').update({current_season:season,current_week:week,updated_at:new Date().toISOString()}).eq('id',1);if(error){$('commissionerMessage').textContent='Could not change week: '+error.message;return}$('commissionerMessage').textContent='Week changed. Syncing NFL schedule...';const{data:syncData,error:syncError}=await supabase.functions.invoke('sync-nfl',{body:{}});if(syncError)$('commissionerMessage').textContent='Week changed, but NFL sync failed. Automatic sync will retry.';else if(syncData&&syncData.success===false)$('commissionerMessage').textContent='Week changed, but NFL sync returned an error: '+syncData.error;else $('commissionerMessage').textContent='Week changed and NFL schedule synced.';await loadCurrentWeek()};
const url=new URL(window.location.href);let waitingForAuth=url.searchParams.has('code')||window.location.hash.includes('type=recovery');supabase.auth.onAuthStateChange((event,session)=>{setTimeout(async()=>{if(event==='PASSWORD_RECOVERY'){waitingForAuth=false;currentUser=session?session.user:null;showResetScreen();return}if(event==='INITIAL_SESSION'){if(waitingForAuth)return;if(session?.user)await showLoggedInUser(session.user);else showLoginScreen()}if(event==='SIGNED_OUT'&&!recoveryMode)showLoginScreen()},0)});if('serviceWorker'in navigator)navigator.serviceWorker.register('./service-worker.js');
</script>
