<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <title>Family NFL Survivor</title>

    <link rel="manifest" href="./manifest.json">

    <link
        rel="apple-touch-icon"
        href="./apple-touch-icon.png"
    >

    <meta
        name="theme-color"
        content="#2557a7"
    >

    <meta
        name="mobile-web-app-capable"
        content="yes"
    >

    <meta
        name="apple-mobile-web-app-capable"
        content="yes"
    >

    <meta
        name="apple-mobile-web-app-status-bar-style"
        content="default"
    >

    <meta
        name="apple-mobile-web-app-title"
        content="NFL Survivor"
    >

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            max-width: 700px;
            margin: 0 auto;
            padding: 20px;
            padding-top: max(20px, env(safe-area-inset-top));
            padding-bottom: calc(
                105px + env(safe-area-inset-bottom)
            );
            background: #f4f5f7;
            color: #222;
        }

        h1,
        h2 {
            text-align: center;
        }

        input,
        button,
        select {
            font-size: 16px;
        }

        input,
        select {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border: 1px solid #bbb;
            border-radius: 6px;
            background: white;
        }

        button {
            cursor: pointer;
        }

        #login,
        #resetPasswordScreen {
            max-width: 450px;
            margin: 60px auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 1px 4px rgba(0,0,0,.12);
        }

        #loginButton,
        #setNewPasswordButton {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
        }

        #forgotPasswordButton {
            display: block;
            width: 100%;
            border: none;
            background: none;
            color: #2557a7;
            text-decoration: underline;
            padding: 12px 0 4px;
        }

        #message,
        #resetPasswordMessage {
            margin-top: 15px;
            text-align: center;
        }

        #resetPasswordScreen,
        #app {
            display: none;
        }

        #welcome {
            margin-bottom: 5px;
        }

        #weekInfo {
            text-align: center;
            font-size: 17px;
            font-weight: bold;
            margin-bottom: 20px;
            color: #555;
        }

        .app-section {
            display: none;
        }

        .app-section.active {
            display: block;
        }

        .section-title {
            margin-top: 22px;
            margin-bottom: 12px;
        }

        #pickStatus {
            background: white;
            border-radius: 10px;
            padding: 18px;
            margin-bottom: 20px;
            text-align: center;
            box-shadow: 0 1px 4px rgba(0,0,0,.12);
        }

        #pickStatusTitle {
            font-size: 14px;
            color: #666;
            margin-bottom: 6px;
            text-transform: uppercase;
            font-weight: bold;
        }

        #pickStatusTeam {
            font-size: 23px;
            font-weight: bold;
        }

        #pickStatusNote {
            margin-top: 7px;
            font-size: 14px;
            color: #666;
        }

        #pickMessage {
            text-align: center;
            margin-bottom: 15px;
            font-weight: bold;
        }

        #standings,
        #familyPicks,
        #myPickHistory,
        #playerHistory,
        #weekHistory {
            background: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 1px 4px rgba(0,0,0,.12);
            margin-bottom: 25px;
        }

        .standing-row,
        .family-row,
        .history-row,
        .week-history-row {
            border-bottom: 1px solid #eee;
        }

        .standing-row:last-child,
        .family-row:last-child,
        .history-row:last-child,
        .week-history-row:last-child {
            border-bottom: none;
        }

        .standing-row,
        .family-row,
        .week-history-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 16px;
            gap: 12px;
        }

        .standing-name,
        .player-name,
        .week-player-name {
            font-weight: bold;
        }

        .standing-info,
        .player-pick,
        .week-player-pick {
            text-align: right;
        }

        .strike-count {
            font-weight: bold;
        }

        .alive {
            color: #176629;
            font-size: 12px;
            margin-top: 3px;
        }

        .eliminated {
            color: #a21d1d;
            font-size: 12px;
            font-weight: bold;
            margin-top: 3px;
        }

        .hidden-pick {
            color: #888;
            font-style: italic;
        }

        .my-pick-label {
            font-size: 11px;
            background: #e5efff;
            padding: 3px 6px;
            border-radius: 8px;
            margin-left: 6px;
            color: #2557a7;
        }

        .history-row {
            display: grid;
            grid-template-columns: 75px 1fr auto;
            gap: 12px;
            align-items: center;
            padding: 15px 16px;
        }

        .history-week {
            font-weight: bold;
            color: #555;
        }

        .history-team {
            font-weight: bold;
        }

        .history-team.win {
            color: #176629;
        }

        .history-team.loss {
            color: #a21d1d;
        }

        .history-team.tie {
            color: #936500;
        }

        .history-team.pending,
        .history-team.void,
        .history-team.none,
        .history-team.hidden {
            color: #666;
        }

        .history-team.hidden {
            font-style: italic;
        }

        .result-badge {
            font-size: 12px;
            font-weight: bold;
            padding: 5px 8px;
            border-radius: 10px;
            white-space: nowrap;
        }

        .result-badge.win {
            color: #176629;
            background: #e5f7e8;
        }

        .result-badge.loss {
            color: #a21d1d;
            background: #fde8e8;
        }

        .result-badge.tie {
            color: #765000;
            background: #fff1c8;
        }

        .result-badge.pending,
        .result-badge.void,
        .result-badge.none,
        .result-badge.hidden {
            color: #555;
            background: #eee;
        }

        .screen-description {
            color: #666;
            font-size: 14px;
            margin-top: -5px;
            margin-bottom: 18px;
        }

        .history-controls {
            background: white;
            padding: 16px;
            border-radius: 10px;
            margin-bottom: 15px;
            box-shadow: 0 1px 4px rgba(0,0,0,.12);
        }

        .view-toggle {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 12px;
        }

        .view-toggle button {
            padding: 11px;
            border: 1px solid #bbb;
            border-radius: 8px;
            background: white;
            font-weight: bold;
        }

        .view-toggle button.active {
            background: #2557a7;
            color: white;
            border-color: #2557a7;
        }

        .history-view {
            display: none;
        }

        .history-view.active {
            display: block;
        }

        #commissionerPanel {
            display: none;
            background: #fff8dd;
            border: 1px solid #d8c67a;
            border-radius: 10px;
            padding: 18px;
            margin-bottom: 25px;
        }

        #commissionerPanel h3 {
            margin-top: 0;
        }

        .admin-fields {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .admin-field label {
            display: block;
            font-size: 13px;
            font-weight: bold;
            color: #555;
        }

        .admin-week-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 6px;
        }

        .admin-week-buttons button,
        #saveWeekButton {
            padding: 11px;
            width: 100%;
        }

        #saveWeekButton {
            margin-top: 12px;
            font-weight: bold;
        }

        #commissionerMessage {
            margin-top: 12px;
            text-align: center;
            font-size: 14px;
            font-weight: bold;
        }

        #games {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .game-card {
            background: white;
            border-radius: 10px;
            padding: 16px;
            box-shadow: 0 1px 4px rgba(0,0,0,.12);
        }

        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            gap: 10px;
        }

        .kickoff {
            font-size: 14px;
            color: #555;
        }

        .status {
            font-size: 13px;
            font-weight: bold;
            padding: 5px 9px;
            border-radius: 12px;
        }

        .status.available {
            background: #e5f7e8;
            color: #176629;
        }

        .status.locked {
            background: #eee;
            color: #666;
        }

        .teams {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .team-button {
            padding: 14px 10px;
            border-radius: 8px;
            border: 1px solid #aaa;
            background: white;
            font-weight: bold;
            width: 100%;
        }

        .team-button.selected {
            background: #dce8ff;
            border: 2px solid #2557a7;
        }

        .team-button:disabled {
            background: #eee;
            color: #999;
            cursor: not-allowed;
        }

        .team-button.selected:disabled {
            background: #dce8ff;
            color: #222;
            border: 2px solid #2557a7;
        }

        .team-button.used {
            background: #f3f3f3;
            color: #888;
            text-decoration: line-through;
        }

        .used-label {
            display: block;
            margin-top: 4px;
            font-size: 11px;
            text-decoration: none;
        }

        #loading {
            text-align: center;
            padding: 20px;
        }

        #accountPanel {
            background: white;
            border-radius: 10px;
            padding: 18px;
            box-shadow: 0 1px 4px rgba(0,0,0,.12);
        }

        #changePasswordButton,
        #logoutButton {
            width: 100%;
            padding: 12px;
        }

        #changePasswordButton {
            margin-top: 8px;
        }

        #logoutButton {
            margin-top: 20px;
        }

        #changePasswordMessage {
            text-align: center;
            margin-top: 12px;
            font-weight: bold;
        }

        .password-help {
            font-size: 13px;
            color: #666;
            margin: 3px 0 8px;
        }

        #bottomNav {
            position: fixed;
            left: 50%;
            bottom: 0;
            transform: translateX(-50%);
            width: 100%;
            max-width: 700px;
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            background: white;
            border-top: 1px solid #ddd;
            box-shadow: 0 -2px 8px rgba(0,0,0,.10);
            padding-bottom: env(safe-area-inset-bottom);
            z-index: 1000;
        }

        .nav-button {
            min-width: 0;
            border: none;
            background: white;
            padding: 13px 2px 11px;
            font-size: 12px;
            color: #666;
            font-weight: bold;
        }

        .nav-button.active {
            color: #2557a7;
            background: #f1f5ff;
        }

        @media (max-width: 500px) {

            body {
                padding-left: 14px;
                padding-right: 14px;
            }

            .teams,
            .admin-fields {
                grid-template-columns: 1fr;
            }

            .history-row {
                grid-template-columns: 65px 1fr auto;
                padding-left: 12px;
                padding-right: 12px;
                gap: 8px;
            }
        }

    </style>
</head>

<body>

    <div id="login">

        <h1>Family NFL Survivor</h1>

        <input id="email" type="email" placeholder="Email">
        <input id="password" type="password" placeholder="Password">

        <button id="loginButton">Sign In</button>

        <button id="forgotPasswordButton">
            Forgot password?
        </button>

        <div id="message"></div>

    </div>


    <div id="resetPasswordScreen">

        <h1>Set New Password</h1>

        <input
            id="resetNewPassword"
            type="password"
            placeholder="New password"
        >

        <input
            id="resetConfirmPassword"
            type="password"
            placeholder="Confirm new password"
        >

        <button id="setNewPasswordButton">
            Set New Password
        </button>

        <div id="resetPasswordMessage"></div>

    </div>


    <div id="app">

        <h1 id="poolName">
            Family NFL Survivor
        </h1>

        <h2 id="welcome"></h2>

        <div id="weekInfo"></div>


        <section
            class="app-section active"
            data-section="home"
        >

            <div id="pickStatus">

                <div id="pickStatusTitle">
                    Your Pick
                </div>

                <div id="pickStatusTeam">
                    No pick submitted
                </div>

                <div id="pickStatusNote"></div>

            </div>

            <div id="pickMessage"></div>

            <h3 class="section-title">
                Strike Count
            </h3>

            <div id="standings"></div>

            <h3
                id="weekPicksHeading"
                class="section-title"
            ></h3>

            <div id="familyPicks"></div>

        </section>


        <section
            class="app-section"
            data-section="my-picks"
        >

            <h3 class="section-title">
                My Picks
            </h3>

            <div
                id="myPicksDescription"
                class="screen-description"
            ></div>

            <div id="myPickHistory"></div>

        </section>


        <section
            class="app-section"
            data-section="players"
        >

            <h3 class="section-title">
                Pick History
            </h3>

            <div class="history-controls">

                <div class="view-toggle">

                    <button
                        id="byPlayerButton"
                        class="active"
                    >
                        By Player
                    </button>

                    <button id="byWeekButton">
                        By Week
                    </button>

                </div>


                <div
                    id="playerHistoryControls"
                    class="history-view active"
                >

                    <label>
                        Player
                    </label>

                    <select id="playerHistorySelect"></select>

                </div>


                <div
                    id="weekHistoryControls"
                    class="history-view"
                >

                    <label>
                        Week
                    </label>

                    <select id="weekHistorySelect"></select>

                </div>

            </div>


            <div
                id="playerHistoryView"
                class="history-view active"
            >

                <div id="playerHistory"></div>

            </div>


            <div
                id="weekHistoryView"
                class="history-view"
            >

                <div id="weekHistory"></div>

            </div>

        </section>


        <section
            class="app-section"
            data-section="pick"
        >

            <h3 class="section-title">
                Choose Your Team
            </h3>

            <div id="loading">
                Loading games...
            </div>

            <div id="games"></div>

        </section>


        <section
            class="app-section"
            data-section="account"
        >

            <div id="commissionerPanel">

                <h3>
                    Commissioner Controls
                </h3>

                <div class="admin-fields">

                    <div class="admin-field">

                        <label>
                            Season
                        </label>

                        <input
                            id="adminSeason"
                            type="number"
                        >

                    </div>

                    <div class="admin-field">

                        <label>
                            Week
                        </label>

                        <input
                            id="adminWeek"
                            type="number"
                        >

                    </div>

                </div>

                <div class="admin-week-buttons">

                    <button id="previousWeekButton">
                        Previous Week
                    </button>

                    <button id="nextWeekButton">
                        Next Week
                    </button>

                </div>

                <button id="saveWeekButton">
                    Save &amp; Sync Week
                </button>

                <div id="commissionerMessage"></div>

            </div>


            <div id="accountPanel">

                <h3>
                    Account
                </h3>

                <input
                    id="accountNewPassword"
                    type="password"
                    placeholder="New password"
                >

                <input
                    id="accountConfirmPassword"
                    type="password"
                    placeholder="Confirm new password"
                >

                <button id="changePasswordButton">
                    Change Password
                </button>

                <div id="changePasswordMessage"></div>

            </div>

            <button id="logoutButton">
                Sign Out
            </button>

        </section>


        <nav id="bottomNav">

            <button
                class="nav-button active"
                data-target="home"
            >
                Home
            </button>

            <button
                class="nav-button"
                data-target="my-picks"
            >
                My Picks
            </button>

            <button
                class="nav-button"
                data-target="players"
            >
                Players
            </button>

            <button
                class="nav-button"
                data-target="pick"
            >
                Pick
            </button>

            <button
                class="nav-button"
                data-target="account"
            >
                Account
            </button>

        </nav>

    </div>


    <script type="module">

        import {
            createClient
        } from
        'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';


        const supabase = createClient(
            'https://nvtsrpfzedzzoeyvobcb.supabase.co',
            'sb_publishable_7xYfbXDNCZSUqFTipF9A-Q_MHeVqTnz'
        );


        let currentUser = null;
        let currentProfile = null;
        let currentSeason = null;
        let currentWeek = null;
        let maxStrikes = 3;

        let profiles = [];
        let teamMap = new Map();

        let currentGames = [];
        let seasonGames = [];

        let currentPick = null;
        let seasonPicks = [];
        let visiblePicks = [];
        let visibleSeasonPicks = [];
        let lossPicks = [];

        let usedTeamIds = new Set();
        let recoveryMode = false;


        const $ =
            id => document.getElementById(id);


        function showAppSection(target) {

            document
                .querySelectorAll('.app-section')
                .forEach(section => {

                    section.classList.toggle(
                        'active',
                        section.dataset.section === target
                    );
                });


            document
                .querySelectorAll('.nav-button')
                .forEach(button => {

                    button.classList.toggle(
                        'active',
                        button.dataset.target === target
                    );
                });


            window.scrollTo({
                top: 0,
                behavior: 'smooth'
            });
        }


        document
            .querySelectorAll('.nav-button')
            .forEach(button => {

                button.addEventListener(
                    'click',
                    () => {

                        showAppSection(
                            button.dataset.target
                        );
                    }
                );
            });


        function showLoginScreen() {

            $('login').style.display =
                'block';

            $('resetPasswordScreen').style.display =
                'none';

            $('app').style.display =
                'none';
        }


        function showResetScreen() {

            recoveryMode =
                true;

            $('login').style.display =
                'none';

            $('app').style.display =
                'none';

            $('resetPasswordScreen').style.display =
                'block';
        }


        async function showLoggedInUser(user) {

            currentUser =
                user;


            const {
                data,
                error
            } = await supabase
                .from('profiles')
                .select(
                    'display_name, is_commissioner'
                )
                .eq(
                    'id',
                    user.id
                )
                .single();


            if (error) {

                showLoginScreen();

                $('message').textContent =
                    error.message;

                return;
            }


            currentProfile =
                data;


            $('login').style.display =
                'none';

            $('resetPasswordScreen').style.display =
                'none';

            $('app').style.display =
                'block';


            $('welcome').textContent =
                'Welcome, ' +
                data.display_name;


            $('commissionerPanel').style.display =
                data.is_commissioner
                    ? 'block'
                    : 'none';


            showAppSection('home');

            await loadCurrentWeek();
        }


        async function loadCurrentWeek() {

            const {
                data: settings
            } = await supabase
                .from('pool_settings')
                .select(
                    'pool_name, current_season, current_week, max_strikes'
                )
                .eq('id', 1)
                .single();


            currentSeason =
                settings.current_season;

            currentWeek =
                settings.current_week;

            maxStrikes =
                settings.max_strikes;


            $('poolName').textContent =
                settings.pool_name;

            $('weekInfo').textContent =
                currentSeason +
                ' Season - Week ' +
                currentWeek;

            $('weekPicksHeading').textContent =
                'Week ' +
                currentWeek +
                ' Picks';

            $('myPicksDescription').textContent =
                currentSeason +
                ' season pick history.';

            $('adminSeason').value =
                currentSeason;

            $('adminWeek').value =
                currentWeek;


            await loadTeams();
            await loadProfiles();
            await loadSeasonGames();
            await loadGames();
            await loadMySeasonPicks();
            await loadMyPick();
            await loadVisiblePicks();
            await loadVisibleSeasonPicks();
            await loadLossPicks();


            populateHistorySelectors();

            renderMyPick();
            renderStandings();
            renderFamilyPicks();
            renderMyPickHistory();
            renderPlayerHistory();
            renderWeekHistory();
            renderGames();
        }


        async function loadTeams() {

            const {
                data
            } = await supabase
                .from('teams')
                .select(
                    'id, full_name'
                );


            teamMap =
                new Map();


            data.forEach(team => {

                teamMap.set(
                    team.id,
                    team
                );
            });
        }


        async function loadProfiles() {

            const {
                data
            } = await supabase
                .from('profiles')
                .select(
                    'id, display_name'
                )
                .order('display_name');


            profiles =
                data || [];
        }


        async function loadSeasonGames() {

            const {
                data
            } = await supabase
                .from('games')
                .select(
                    'id, week, kickoff_at'
                )
                .eq(
                    'season',
                    currentSeason
                );


            seasonGames =
                data || [];
        }


        async function loadGames() {

            const {
                data
            } = await supabase
                .from('games')
                .select(`
                    id,
                    away_team_id,
                    home_team_id,
                    kickoff_at,
                    status
                `)
                .eq(
                    'season',
                    currentSeason
                )
                .eq(
                    'week',
                    currentWeek
                )
                .order('kickoff_at');


            currentGames =
                data || [];


            $('loading').style.display =
                'none';
        }


        async function loadMySeasonPicks() {

            const {
                data
            } = await supabase
                .from('picks')
                .select(
                    'id, week, team_id, game_id, result'
                )
                .eq(
                    'player_id',
                    currentUser.id
                )
                .eq(
                    'season',
                    currentSeason
                );


            seasonPicks =
                data || [];


            usedTeamIds =
                new Set(
                    seasonPicks
                        .filter(
                            p =>
                                p.week !==
                                currentWeek
                        )
                        .map(
                            p =>
                                p.team_id
                        )
                );
        }


        async function loadMyPick() {

            const {
                data
            } = await supabase
                .from('picks')
                .select('*')
                .eq(
                    'player_id',
                    currentUser.id
                )
                .eq(
                    'season',
                    currentSeason
                )
                .eq(
                    'week',
                    currentWeek
                )
                .maybeSingle();


            currentPick =
                data;
        }


        async function loadVisiblePicks() {

            const {
                data
            } = await supabase
                .from('picks')
                .select(
                    'player_id, team_id, game_id, result'
                )
                .eq(
                    'season',
                    currentSeason
                )
                .eq(
                    'week',
                    currentWeek
                );


            visiblePicks =
                data || [];
        }


        async function loadVisibleSeasonPicks() {

            const {
                data
            } = await supabase
                .from('picks')
                .select(
                    'player_id, week, team_id, game_id, result'
                )
                .eq(
                    'season',
                    currentSeason
                );


            visibleSeasonPicks =
                data || [];
        }


        async function loadLossPicks() {

            const {
                data
            } = await supabase
                .from('picks')
                .select('player_id')
                .eq(
                    'season',
                    currentSeason
                )
                .eq(
                    'result',
                    'loss'
                );


            lossPicks =
                data || [];
        }


        function populateHistorySelectors() {

            $('playerHistorySelect').innerHTML =
                profiles.map(
                    p =>
                        `<option value="${p.id}">
                            ${p.display_name}
                        </option>`
                ).join('');


            $('playerHistorySelect').value =
                currentUser.id;


            let weekOptions =
                '';


            for (
                let week = 1;
                week <= currentWeek;
                week++
            ) {

                weekOptions +=
                    `<option value="${week}">
                        Week ${week}
                    </option>`;
            }


            $('weekHistorySelect').innerHTML =
                weekOptions;


            $('weekHistorySelect').value =
                currentWeek;
        }


        function weekIsFullyStarted(week) {

            const games =
                seasonGames.filter(
                    game =>
                        game.week ===
                        week
                );


            if (games.length === 0) {
                return false;
            }


            return games.every(
                game =>
                    new Date(
                        game.kickoff_at
                    ) <=
                    new Date()
            );
        }


        function resultInfo(result) {

            if (result === 'win') {
                return ['WIN', 'win'];
            }

            if (result === 'loss') {
                return ['LOSS', 'loss'];
            }

            if (result === 'tie') {
                return ['TIE', 'tie'];
            }

            if (result === 'void') {
                return ['VOID', 'void'];
            }

            return ['PENDING', 'pending'];
        }


        function renderMyPickHistory() {

            const pickMap =
                new Map(
                    seasonPicks.map(
                        p => [p.week, p]
                    )
                );


            let html =
                '';


            for (
                let week = currentWeek;
                week >= 1;
                week--
            ) {

                const pick =
                    pickMap.get(week);


                if (!pick) {

                    html += `
                        <div class="history-row">
                            <div class="history-week">
                                Week ${week}
                            </div>
                            <div class="history-team none">
                                No Pick
                            </div>
                            <div class="result-badge none">
                                NO PICK
                            </div>
                        </div>
                    `;

                    continue;
                }


                const team =
                    teamMap.get(
                        pick.team_id
                    );


                const [
                    label,
                    className
                ] = resultInfo(
                    pick.result
                );


                html += `
                    <div class="history-row">

                        <div class="history-week">
                            Week ${week}
                        </div>

                        <div class="history-team ${className}">
                            ${team?.full_name || 'Unknown Team'}
                        </div>

                        <div class="result-badge ${className}">
                            ${label}
                        </div>

                    </div>
                `;
            }


            $('myPickHistory').innerHTML =
                html;
        }


        function renderPlayerHistory() {

            const playerId =
                $('playerHistorySelect').value;


            const player =
                profiles.find(
                    p =>
                        p.id ===
                        playerId
                );


            if (!player) {
                return;
            }


            let html =
                '';


            for (
                let week = currentWeek;
                week >= 1;
                week--
            ) {

                const pick =
                    visibleSeasonPicks.find(
                        p =>
                            p.player_id ===
                                playerId &&
                            p.week ===
                                week
                    );


                if (!pick) {

                    const fullyStarted =
                        weekIsFullyStarted(
                            week
                        );


                    const label =
                        fullyStarted
                            ? 'No Pick'
                            : 'Hidden / Not Revealed';


                    html += `
                        <div class="history-row">

                            <div class="history-week">
                                Week ${week}
                            </div>

                            <div class="history-team ${
                                fullyStarted
                                    ? 'none'
                                    : 'hidden'
                            }">
                                ${label}
                            </div>

                            <div class="result-badge ${
                                fullyStarted
                                    ? 'none'
                                    : 'hidden'
                            }">
                                ${
                                    fullyStarted
                                        ? 'NO PICK'
                                        : 'HIDDEN'
                                }
                            </div>

                        </div>
                    `;

                    continue;
                }


                const team =
                    teamMap.get(
                        pick.team_id
                    );


                const [
                    label,
                    className
                ] = resultInfo(
                    pick.result
                );


                html += `
                    <div class="history-row">

                        <div class="history-week">
                            Week ${week}
                        </div>

                        <div class="history-team ${className}">
                            ${team?.full_name || 'Unknown Team'}
                        </div>

                        <div class="result-badge ${className}">
                            ${label}
                        </div>

                    </div>
                `;
            }


            $('playerHistory').innerHTML =
                html;
        }


        function renderWeekHistory() {

            const week =
                Number(
                    $('weekHistorySelect').value
                );


            const fullyStarted =
                weekIsFullyStarted(
                    week
                );


            $('weekHistory').innerHTML =
                profiles.map(
                    player => {

                        const pick =
                            visibleSeasonPicks.find(
                                p =>
                                    p.player_id ===
                                        player.id &&
                                    p.week ===
                                        week
                            );


                        let text;
                        let className =
                            'week-player-pick';


                        if (pick) {

                            const team =
                                teamMap.get(
                                    pick.team_id
                                );

                            text =
                                team?.full_name ||
                                'Unknown Team';

                        } else if (
                            fullyStarted
                        ) {

                            text =
                                'No Pick';

                            className +=
                                ' hidden-pick';

                        } else {

                            text =
                                'Hidden / Not Revealed';

                            className +=
                                ' hidden-pick';
                        }


                        return `
                            <div class="week-history-row">

                                <div class="week-player-name">
                                    ${player.display_name}
                                </div>

                                <div class="${className}">
                                    ${text}
                                </div>

                            </div>
                        `;
                    }
                ).join('');
        }


        function renderStandings() {

            $('standings').innerHTML =
                profiles.map(
                    player => {

                        const strikes =
                            lossPicks.filter(
                                p =>
                                    p.player_id ===
                                    player.id
                            ).length;


                        const eliminated =
                            strikes >=
                            maxStrikes;


                        return `
                            <div class="standing-row">

                                <div class="standing-name">
                                    ${player.display_name}
                                </div>

                                <div class="standing-info">

                                    <div class="strike-count">
                                        ${strikes}
                                        ${
                                            strikes === 1
                                                ? 'strike'
                                                : 'strikes'
                                        }
                                    </div>

                                    <div class="${
                                        eliminated
                                            ? 'eliminated'
                                            : 'alive'
                                    }">
                                        ${
                                            eliminated
                                                ? 'Eliminated'
                                                : 'Still Alive'
                                        }
                                    </div>

                                </div>

                            </div>
                        `;
                    }
                ).join('');
        }


        function renderFamilyPicks() {

            $('familyPicks').innerHTML =
                profiles.map(
                    player => {

                        const pick =
                            visiblePicks.find(
                                p =>
                                    p.player_id ===
                                    player.id
                            );


                        const team =
                            pick
                                ? teamMap.get(
                                    pick.team_id
                                )
                                : null;


                        return `
                            <div class="family-row">

                                <div class="player-name">
                                    ${player.display_name}

                                    ${
                                        player.id ===
                                        currentUser.id
                                            ? '<span class="my-pick-label">YOU</span>'
                                            : ''
                                    }
                                </div>

                                <div class="${
                                    team
                                        ? 'player-pick'
                                        : 'player-pick hidden-pick'
                                }">
                                    ${
                                        team
                                            ? team.full_name
                                            : 'Hidden / Not Revealed'
                                    }
                                </div>

                            </div>
                        `;
                    }
                ).join('');
        }


        function renderMyPick() {

            if (!currentPick) {

                $('pickStatusTeam').textContent =
                    'No pick submitted';

                $('pickStatusNote').textContent =
                    'Select a team from the Pick tab.';

                return;
            }


            const team =
                teamMap.get(
                    currentPick.team_id
                );


            $('pickStatusTeam').textContent =
                team?.full_name ||
                'Unknown Team';


            const game =
                currentGames.find(
                    g =>
                        g.id ===
                        currentPick.game_id
                );


            $('pickStatusNote').textContent =
                game &&
                new Date(game.kickoff_at) <=
                new Date()
                    ? 'Locked. This game has started.'
                    : 'You may change this pick until kickoff.';
        }


        function renderGames() {

            const now =
                new Date();


            $('games').innerHTML =
                currentGames.map(
                    game => {

                        const away =
                            teamMap.get(
                                game.away_team_id
                            );

                        const home =
                            teamMap.get(
                                game.home_team_id
                            );


                        const started =
                            new Date(
                                game.kickoff_at
                            ) <=
                            now;


                        return `
                            <div class="game-card">

                                <div class="game-header">

                                    <div class="kickoff">
                                        ${
                                            new Date(
                                                game.kickoff_at
                                            ).toLocaleString(
                                                [],
                                                {
                                                    weekday: 'short',
                                                    month: 'short',
                                                    day: 'numeric',
                                                    hour: 'numeric',
                                                    minute: '2-digit'
                                                }
                                            )
                                        }
                                    </div>

                                    <div class="status ${
                                        started
                                            ? 'locked'
                                            : 'available'
                                    }">
                                        ${
                                            started
                                                ? 'Locked'
                                                : 'Available'
                                        }
                                    </div>

                                </div>

                                <div class="teams">

                                    ${teamButton(
                                        game,
                                        away,
                                        started
                                    )}

                                    ${teamButton(
                                        game,
                                        home,
                                        started
                                    )}

                                </div>

                            </div>
                        `;
                    }
                ).join('');


            document
                .querySelectorAll(
                    '.team-button:not(:disabled)'
                )
                .forEach(
                    button => {

                        button.onclick =
                            () =>
                                chooseTeam(
                                    Number(
                                        button.dataset.gameId
                                    ),
                                    Number(
                                        button.dataset.teamId
                                    )
                                );
                    }
                );
        }


        function teamButton(
            game,
            team,
            started
        ) {

            const selected =
                currentPick?.team_id ===
                team.id;

            const used =
                usedTeamIds.has(
                    team.id
                );

            const disabled =
                started ||
                used;


            return `
                <button
                    class="
                        team-button
                        ${selected ? 'selected' : ''}
                        ${used ? 'used' : ''}
                    "
                    data-game-id="${game.id}"
                    data-team-id="${team.id}"
                    ${disabled ? 'disabled' : ''}
                >
                    ${team.full_name}

                    ${
                        used
                            ? '<span class="used-label">USED</span>'
                            : ''
                    }
                </button>
            `;
        }


        async function chooseTeam(
            gameId,
            teamId
        ) {

            const team =
                teamMap.get(
                    teamId
                );


            if (
                !confirm(
                    currentPick
                        ? `Change your pick to ${team.full_name}?`
                        : `Submit ${team.full_name} as your Week ${currentWeek} pick?`
                )
            ) {
                return;
            }


            if (!currentPick) {

                await supabase
                    .from('picks')
                    .insert({
                        player_id:
                            currentUser.id,
                        game_id:
                            gameId,
                        season:
                            currentSeason,
                        week:
                            currentWeek,
                        team_id:
                            teamId
                    });

            } else {

                await supabase
                    .from('picks')
                    .update({
                        game_id:
                            gameId,
                        team_id:
                            teamId
                    })
                    .eq(
                        'id',
                        currentPick.id
                    );
            }


            await loadCurrentWeek();
        }


        $('byPlayerButton').onclick =
            () => {

                $('byPlayerButton')
                    .classList.add(
                        'active'
                    );

                $('byWeekButton')
                    .classList.remove(
                        'active'
                    );

                $('playerHistoryControls')
                    .classList.add(
                        'active'
                    );

                $('playerHistoryView')
                    .classList.add(
                        'active'
                    );

                $('weekHistoryControls')
                    .classList.remove(
                        'active'
                    );

                $('weekHistoryView')
                    .classList.remove(
                        'active'
                    );
            };


        $('byWeekButton').onclick =
            () => {

                $('byWeekButton')
                    .classList.add(
                        'active'
                    );

                $('byPlayerButton')
                    .classList.remove(
                        'active'
                    );

                $('weekHistoryControls')
                    .classList.add(
                        'active'
                    );

                $('weekHistoryView')
                    .classList.add(
                        'active'
                    );

                $('playerHistoryControls')
                    .classList.remove(
                        'active'
                    );

                $('playerHistoryView')
                    .classList.remove(
                        'active'
                    );
            };


        $('playerHistorySelect')
            .addEventListener(
                'change',
                renderPlayerHistory
            );


        $('weekHistorySelect')
            .addEventListener(
                'change',
                renderWeekHistory
            );


        $('loginButton').onclick =
            async () => {

                const {
                    data,
                    error
                } = await supabase.auth
                    .signInWithPassword({
                        email:
                            $('email')
                                .value
                                .trim(),
                        password:
                            $('password')
                                .value
                    });


                if (error) {

                    $('message').textContent =
                        error.message;

                    return;
                }


                await showLoggedInUser(
                    data.user
                );
            };


        $('forgotPasswordButton').onclick =
            async () => {

                const email =
                    $('email')
                        .value
                        .trim();


                if (!email) {

                    $('message').textContent =
                        'Enter your email address first.';

                    return;
                }


                await supabase.auth
                    .resetPasswordForEmail(
                        email,
                        {
                            redirectTo:
                                window.location.origin +
                                window.location.pathname
                        }
                    );


                $('message').textContent =
                    'Password reset email sent.';
            };


        $('setNewPasswordButton').onclick =
            async () => {

                const password =
                    $('resetNewPassword')
                        .value;


                if (
                    password !==
                    $('resetConfirmPassword')
                        .value
                ) {

                    $('resetPasswordMessage')
                        .textContent =
                        'Passwords do not match.';

                    return;
                }


                await supabase.auth
                    .updateUser({
                        password
                    });


                recoveryMode =
                    false;


                const {
                    data
                } = await supabase.auth
                    .getUser();


                await showLoggedInUser(
                    data.user
                );
            };


        $('changePasswordButton').onclick =
            async () => {

                const password =
                    $('accountNewPassword')
                        .value;


                if (
                    password !==
                    $('accountConfirmPassword')
                        .value
                ) {

                    $('changePasswordMessage')
                        .textContent =
                        'Passwords do not match.';

                    return;
                }


                await supabase.auth
                    .updateUser({
                        password
                    });


                $('changePasswordMessage')
                    .textContent =
                    'Password changed successfully.';
            };


        $('logoutButton').onclick =
            async () => {

                await supabase.auth
                    .signOut();

                showLoginScreen();
            };


        $('previousWeekButton').onclick =
            () => {

                $('adminWeek').value =
                    Math.max(
                        1,
                        Number(
                            $('adminWeek').value
                        ) - 1
                    );
            };


        $('nextWeekButton').onclick =
            () => {

                $('adminWeek').value =
                    Math.min(
                        22,
                        Number(
                            $('adminWeek').value
                        ) + 1
                    );
            };


        $('saveWeekButton').onclick =
            async () => {

                const season =
                    Number(
                        $('adminSeason').value
                    );

                const week =
                    Number(
                        $('adminWeek').value
                    );


                await supabase
                    .from('pool_settings')
                    .update({
                        current_season:
                            season,
                        current_week:
                            week,
                        updated_at:
                            new Date()
                                .toISOString()
                    })
                    .eq(
                        'id',
                        1
                    );


                await supabase.functions
                    .invoke(
                        'sync-nfl',
                        {
                            body: {}
                        }
                    );


                await loadCurrentWeek();
            };


        const url =
            new URL(
                window.location.href
            );


        const waitingForAuth =
            url.searchParams.has(
                'code'
            ) ||
            window.location.hash.includes(
                'type=recovery'
            );


        supabase.auth
            .onAuthStateChange(
                (
                    event,
                    session
                ) => {

                    setTimeout(
                        async () => {

                            if (
                                event ===
                                'PASSWORD_RECOVERY'
                            ) {

                                showResetScreen();

                                return;
                            }


                            if (
                                event ===
                                'INITIAL_SESSION' &&
                                !waitingForAuth
                            ) {

                                if (
                                    session?.user
                                ) {

                                    await showLoggedInUser(
                                        session.user
                                    );

                                } else {

                                    showLoginScreen();
                                }
                            }

                        },
                        0
                    );
                }
            );


        if (
            'serviceWorker' in
            navigator
        ) {

            navigator.serviceWorker
                .register(
                    './service-worker.js'
                );
        }

    </script>

</body>

</html>
